name: Compilar Meu Launcher TV

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compilar-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v5

      - name: Escrever os arquivos do app
        run: |
          mkdir -p "app"
          cat > "app/build.gradle" <<'FIM_DO_ARQUIVO'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.meulauncher.tv'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.meulauncher.tv'
                  minSdk 21
                  targetSdk 30
                  versionCode 2
                  versionName '1.1'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          FIM_DO_ARQUIVO

          mkdir -p "app/src/main"
          cat > "app/src/main/AndroidManifest.xml" <<'FIM_DO_ARQUIVO'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <uses-feature
                  android:name="android.software.leanback"
                  android:required="false" />

              <uses-feature
                  android:name="android.hardware.touchscreen"
                  android:required="false" />

              <!-- Android 11+: sem isto o launcher nao enxerga os apps instalados -->
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:label="Meu Launcher TV"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".HomeActivity"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="landscape"
                      android:stateNotNeeded="true">

                      <!-- Tela inicial (botao HOME do controle) -->
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>

                      <!-- Aparece tambem como um app comum (para testar antes) -->
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          FIM_DO_ARQUIVO

          mkdir -p "app/src/main/java/com/meulauncher/tv"
          cat > "app/src/main/java/com/meulauncher/tv/HomeActivity.java" <<'FIM_DO_ARQUIVO'
          package com.meulauncher.tv;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.drawable.Drawable;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.util.Base64;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.AdapterView;
          import android.widget.ArrayAdapter;
          import android.widget.ListView;
          import android.widget.Toast;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.text.Collator;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;

          public class HomeActivity extends Activity {

              private static final String PAGINA = "file:///android_asset/index.html";

              private WebView webView;
              private boolean paginaPronta = false;

              private static class App {
                  String pacote;
                  String nome;
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  modoImersivo();

                  try {
                      criarWebView();
                  } catch (Throwable erro) {
                      // TV sem WebView funcionando: usa uma lista simples, mas nunca deixa a tela vazia
                      criarListaSimples();
                  }
              }

              private void modoImersivo() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  );
              }

              private void criarWebView() {
                  webView = new WebView(this);
                  webView.setBackgroundColor(0xFF101114);
                  webView.setFocusable(true);
                  webView.setFocusableInTouchMode(true);

                  WebSettings ajustes = webView.getSettings();
                  ajustes.setJavaScriptEnabled(true);
                  ajustes.setDomStorageEnabled(true);

                  webView.addJavascriptInterface(new Ponte(), "Android");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          paginaPronta = true;
                      }

                      @Override
                      public void onReceivedError(WebView view, int codigo, String descricao, String url) {
                          if (url != null && url.startsWith(PAGINA)) {
                              criarListaSimples();
                          }
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          // So aceita a pagina local; nada de abrir sites dentro do launcher
                          return url == null || !url.startsWith("file:///android_asset/");
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient());

                  setContentView(webView);
                  webView.loadUrl(PAGINA);
                  webView.requestFocus();
              }

              // ---------- Ponte entre a pagina (JavaScript) e o Android ----------

              private class Ponte {
                  @JavascriptInterface
                  public String apps() {
                      return listarAppsJson();
                  }

                  @JavascriptInterface
                  public String icone(String pacote) {
                      return iconeBase64(pacote);
                  }

                  @JavascriptInterface
                  public void launch(final String pacote) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              abrirApp(pacote);
                          }
                      });
                  }

                  @JavascriptInterface
                  public void settings() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              abrirConfiguracoes();
                          }
                      });
                  }
              }

              // ---------- Apps instalados ----------

              private List<App> carregarApps() {
                  final PackageManager pm = getPackageManager();
                  Set<String> vistos = new HashSet<String>();
                  List<App> lista = new ArrayList<App>();

                  String[] categorias = {
                          Intent.CATEGORY_LEANBACK_LAUNCHER,
                          Intent.CATEGORY_LAUNCHER
                  };

                  for (String categoria : categorias) {
                      Intent filtro = new Intent(Intent.ACTION_MAIN, null);
                      filtro.addCategory(categoria);

                      List<ResolveInfo> achados = pm.queryIntentActivities(filtro, 0);
                      for (ResolveInfo info : achados) {
                          String pacote = info.activityInfo.packageName;
                          if (pacote.equals(getPackageName())) {
                              continue;
                          }
                          if (vistos.add(pacote)) {
                              App app = new App();
                              app.pacote = pacote;
                              app.nome = String.valueOf(info.loadLabel(pm));
                              lista.add(app);
                          }
                      }
                  }

                  final Collator ordem = Collator.getInstance(new Locale("pt", "BR"));
                  Collections.sort(lista, new Comparator<App>() {
                      @Override
                      public int compare(App a, App b) {
                          return ordem.compare(a.nome, b.nome);
                      }
                  });

                  return lista;
              }

              private String listarAppsJson() {
                  JSONArray resultado = new JSONArray();
                  try {
                      for (App app : carregarApps()) {
                          JSONObject item = new JSONObject();
                          item.put("p", app.pacote);
                          item.put("n", app.nome);
                          resultado.put(item);
                      }
                  } catch (Exception erro) {
                      // devolve o que conseguiu montar
                  }
                  return resultado.toString();
              }

              private String iconeBase64(String pacote) {
                  try {
                      Drawable desenho = getPackageManager().getApplicationIcon(pacote);
                      int tamanho = 96;
                      Bitmap imagem = Bitmap.createBitmap(tamanho, tamanho, Bitmap.Config.ARGB_8888);
                      Canvas tela = new Canvas(imagem);
                      desenho.setBounds(0, 0, tamanho, tamanho);
                      desenho.draw(tela);

                      ByteArrayOutputStream saida = new ByteArrayOutputStream();
                      imagem.compress(Bitmap.CompressFormat.PNG, 100, saida);
                      imagem.recycle();

                      return "data:image/png;base64,"
                              + Base64.encodeToString(saida.toByteArray(), Base64.NO_WRAP);
                  } catch (Throwable erro) {
                      return "";
                  }
              }

              // ---------- Abrir apps e configuracoes ----------

              private void abrirApp(String pacote) {
                  PackageManager pm = getPackageManager();

                  // Apps de TV (Netflix, YouTube TV...) costumam ter so a entrada "leanback"
                  Intent intent = pm.getLeanbackLaunchIntentForPackage(pacote);
                  if (intent == null) {
                      intent = pm.getLaunchIntentForPackage(pacote);
                  }

                  if (intent == null) {
                      Toast.makeText(this, "Nao foi possivel abrir este aplicativo", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try {
                      startActivity(intent);
                  } catch (Exception erro) {
                      Toast.makeText(this, "Nao foi possivel abrir este aplicativo", Toast.LENGTH_SHORT).show();
                  }
              }

              private void abrirConfiguracoes() {
                  Intent intent = new Intent(Settings.ACTION_SETTINGS);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try {
                      startActivity(intent);
                  } catch (Exception erro) {
                      Toast.makeText(this, "Configuracoes indisponiveis", Toast.LENGTH_SHORT).show();
                  }
              }

              // ---------- Plano B: lista simples, sem WebView ----------

              private void criarListaSimples() {
                  final List<App> apps = carregarApps();

                  final List<String> nomes = new ArrayList<String>();
                  final List<String> pacotes = new ArrayList<String>();
                  for (App app : apps) {
                      nomes.add(app.nome);
                      pacotes.add(app.pacote);
                  }
                  nomes.add("Configuracoes");
                  pacotes.add("__config__");

                  ListView lista = new ListView(this);
                  lista.setBackgroundColor(0xFF101114);
                  lista.setAdapter(new ArrayAdapter<String>(
                          this, android.R.layout.simple_list_item_1, nomes));
                  lista.setOnItemClickListener(new AdapterView.OnItemClickListener() {
                      @Override
                      public void onItemClick(AdapterView<?> pai, View item, int posicao, long id) {
                          String pacote = pacotes.get(posicao);
                          if ("__config__".equals(pacote)) {
                              abrirConfiguracoes();
                          } else {
                              abrirApp(pacote);
                          }
                      }
                  });

                  setContentView(lista);
                  lista.requestFocus();
              }

              // ---------- Ciclo de vida ----------

              @Override
              protected void onResume() {
                  super.onResume();
                  if (webView != null && paginaPronta) {
                      webView.evaluateJavascript(
                              "if (window.recarregarApps) { window.recarregarApps(); }", null);
                  }
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  // Botao HOME apertado de novo: volta ao inicio da tela
                  if (webView != null && paginaPronta) {
                      webView.evaluateJavascript(
                              "if (window.irParaInicio) { window.irParaInicio(); }", null);
                  }
              }

              @Override
              public void onWindowFocusChanged(boolean temFoco) {
                  super.onWindowFocusChanged(temFoco);
                  if (temFoco) {
                      modoImersivo();
                  }
              }

              @Override
              public void onBackPressed() {
                  // Tela inicial nao deve fechar com o botao Voltar
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          FIM_DO_ARQUIVO

          mkdir -p "app/src/main/assets"
          cat > "app/src/main/assets/index.html" <<'FIM_DO_ARQUIVO'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <meta name="theme-color" content="#101114">
          <title>Meu Launcher TV</title>

          <style>
          :root {
              --bg: #101114;
              --panel: #1b1d23;
              --text: #ffffff;
              --muted: #a6a8b2;
              --accent: #b7c7ff;
          }

          /* 1rem = 1,25% da largura da tela: tudo se ajusta a qualquer TV */
          html {
              font-size: 1.25vw;
          }

          * {
              box-sizing: border-box;
          }

          body {
              margin: 0;
              padding: 2.4rem 4rem;
              background: var(--bg);
              color: var(--text);
              font-family: Arial, sans-serif;
              overflow-x: hidden;
          }

          header {
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 2rem;
          }

          .brand {
              font-size: 2.2rem;
              font-weight: 700;
          }

          .top-info {
              color: var(--muted);
              font-size: 1.4rem;
          }

          .hero {
              position: relative;
              min-height: 19rem;
              border-radius: 2rem;
              padding: 3rem;
              display: flex;
              align-items: flex-end;
              overflow: hidden;
              background:
                radial-gradient(ellipse at 75% 25%, #6478a8 0%, transparent 32%),
                linear-gradient(110deg, #242b42, #503d61 55%, #151722);
          }

          .hero-content {
              max-width: 45rem;
              position: relative;
              z-index: 1;
          }

          .eyebrow {
              color: var(--accent);
              font-size: 1.2rem;
              font-weight: bold;
              letter-spacing: 0.15rem;
              text-transform: uppercase;
          }

          h1 {
              font-size: 3.4rem;
              margin: 0.8rem 0;
          }

          .hero p {
              color: #e0e1e9;
              font-size: 1.6rem;
              line-height: 1.5;
              margin: 0;
          }

          .section-title {
              font-size: 1.9rem;
              margin: 2.4rem 0 0.6rem;
          }

          /* Cada linha navegavel (apps, destaques) */
          .row {
              display: flex;
              flex-wrap: nowrap;
              overflow-x: auto;
              padding: 1.2rem 0.6rem 1.4rem;
          }

          .row::-webkit-scrollbar {
              display: none;
          }

          .item {
              outline: none;
          }

          .app {
              flex: 0 0 auto;
              width: 9.8rem;
              margin-right: 1.8rem;
              text-align: center;
              color: var(--muted);
              font-size: 1.35rem;
          }

          .app-label {
              white-space: nowrap;
              overflow: hidden;
              text-overflow: ellipsis;
          }

          .app-icon {
              width: 8.2rem;
              height: 8.2rem;
              margin: 0 auto 0.8rem;
              border-radius: 1.8rem;
              background: var(--panel);
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 2.8rem;
              font-weight: bold;
              color: var(--text);
              border: 0.2rem solid transparent;
              overflow: hidden;
          }

          .app-icon img {
              width: 100%;
              height: 100%;
          }

          .app:focus {
              color: var(--text);
          }

          .app:focus .app-icon {
              border-color: var(--accent);
              -webkit-transform: scale(1.1);
              transform: scale(1.1);
          }

          .movie {
              flex: 0 0 22rem;
              height: 12.5rem;
              margin-right: 1.4rem;
              border-radius: 1.2rem;
              display: flex;
              align-items: flex-end;
              padding: 1.2rem;
              font-size: 1.6rem;
              font-weight: bold;
              border: 0.2rem solid transparent;
              background: linear-gradient(140deg, #344c70, #1c2435);
          }

          .movie:nth-child(2) {
              background: linear-gradient(140deg, #793c44, #2a1b2a);
          }

          .movie:nth-child(3) {
              background: linear-gradient(140deg, #76603c, #30251b);
          }

          .movie:nth-child(4) {
              background: linear-gradient(140deg, #3e6865, #172d31);
          }

          .movie:focus {
              border-color: var(--accent);
              -webkit-transform: scale(1.04);
              transform: scale(1.04);
          }

          .note {
              color: var(--muted);
              font-size: 1.2rem;
              margin-top: 2rem;
          }

          /* Visualizacao em tela pequena (so para testar no celular) */
          @media (max-width: 700px) {
              html {
                  font-size: 3vw;
              }

              body {
                  padding: 1.6rem;
              }
          }
          </style>
          </head>

          <body>
          <header>
              <div class="brand">Meu Launcher</div>
              <div class="top-info">Android TV • Início</div>
          </header>

          <main>
              <section class="hero">
                  <div class="hero-content">
                      <div class="eyebrow">Descubra algo novo</div>
                      <h1>Seu próximo favorito começa aqui</h1>
                      <p>Seus aplicativos, filmes e séries em um só lugar.</p>
                  </div>
              </section>

              <h2 class="section-title">Seus aplicativos</h2>
              <section class="row" id="apps"></section>

              <h2 class="section-title">Em destaque para você</h2>
              <section class="row recommendations">
                  <div class="movie item" tabindex="0">Grandes aventuras</div>
                  <div class="movie item" tabindex="0">Noite de cinema</div>
                  <div class="movie item" tabindex="0">Novas histórias</div>
                  <div class="movie item" tabindex="0">Séries em destaque</div>
              </section>

              <p class="note">Meu Launcher TV • versão 1.1</p>
          </main>

          <script>
          // Apps que aparecem primeiro (basta o nome conter a palavra, em minusculas).
          // Para mudar a ordem ou incluir outros, edite esta lista.
          var FAVORITOS = ['youtube', 'netflix', 'globoplay', 'unitv', 'uni tv'];

          // Usado so quando a pagina e aberta fora da TV (previa no celular)
          var DEMO = [
              { p: 'demo.youtube', n: 'YouTube' },
              { p: 'demo.netflix', n: 'Netflix' },
              { p: 'demo.globoplay', n: 'Globoplay' },
              { p: 'demo.unitv', n: 'UNI TV' }
          ];

          var ultimaLista = '';

          function temAndroid() {
              return !!(window.Android && window.Android.apps);
          }

          function posicaoFavorito(app) {
              var nome = String(app.n).toLowerCase();
              for (var i = 0; i < FAVORITOS.length; i++) {
                  if (nome.indexOf(FAVORITOS[i]) !== -1) {
                      return i;
                  }
              }
              return 999;
          }

          function ordenar(lista) {
              return lista
                  .map(function (app, indice) {
                      return { app: app, f: posicaoFavorito(app), i: indice };
                  })
                  .sort(function (a, b) {
                      return (a.f - b.f) || (a.i - b.i);
                  })
                  .map(function (o) {
                      return o.app;
                  });
          }

          function abrirApp(pacote) {
              if (!temAndroid()) {
                  alert('A abertura dos aplicativos funciona dentro da TV.');
                  return;
              }
              if (pacote === '__config__') {
                  window.Android.settings();
              } else {
                  window.Android.launch(pacote);
              }
          }

          function criarTile(app) {
              var tile = document.createElement('div');
              tile.className = 'app item';
              tile.tabIndex = 0;
              tile.setAttribute('data-pkg', app.p);

              var icone = document.createElement('div');
              icone.className = 'app-icon';
              icone.textContent = app.s || (app.n ? app.n.charAt(0).toUpperCase() : '?');

              var nome = document.createElement('div');
              nome.className = 'app-label';
              nome.textContent = app.n;

              tile.appendChild(icone);
              tile.appendChild(nome);
              tile.onclick = function () {
                  abrirApp(app.p);
              };
              return tile;
          }

          function carregarIcones() {
              if (!temAndroid() || !window.Android.icone) {
                  return;
              }
              var tiles = Array.prototype.slice.call(document.querySelectorAll('#apps .app'));
              var i = 0;

              (function proximo() {
                  var fim = Math.min(i + 3, tiles.length);
                  for (; i < fim; i++) {
                      var pacote = tiles[i].getAttribute('data-pkg');
                      if (pacote === '__config__') {
                          continue;
                      }
                      var origem = '';
                      try {
                          origem = window.Android.icone(pacote);
                      } catch (e) {
                          origem = '';
                      }
                      if (origem) {
                          var caixa = tiles[i].firstChild;
                          caixa.textContent = '';
                          var imagem = document.createElement('img');
                          imagem.src = origem;
                          caixa.appendChild(imagem);
                      }
                  }
                  if (i < tiles.length) {
                      setTimeout(proximo, 30);
                  }
              })();
          }

          function carregarApps(forcar) {
              var lista = [];
              var bruto = '';

              if (temAndroid()) {
                  try {
                      bruto = window.Android.apps();
                      lista = JSON.parse(bruto);
                  } catch (e) {
                      lista = [];
                  }
              } else {
                  lista = DEMO;
                  bruto = 'demo';
              }

              // Se nada mudou desde a ultima vez, nao mexe na tela (mantem o foco)
              if (!forcar && bruto === ultimaLista) {
                  return;
              }
              ultimaLista = bruto;

              var linha = document.getElementById('apps');
              var focoAtual = linha.contains(document.activeElement)
                  ? document.activeElement.getAttribute('data-pkg') : null;

              linha.innerHTML = '';
              var todos = ordenar(lista).concat([{ p: '__config__', n: 'Configurações', s: '⚙' }]);
              for (var i = 0; i < todos.length; i++) {
                  linha.appendChild(criarTile(todos[i]));
              }
              carregarIcones();

              var alvo = null;
              if (focoAtual) {
                  alvo = linha.querySelector('[data-pkg="' + focoAtual + '"]');
              }
              if (!alvo && (forcar || focoAtual)) {
                  alvo = linha.querySelector('.item');
              }
              if (alvo) {
                  alvo.focus();
              }
          }

          window.recarregarApps = function () {
              carregarApps(false);
          };

          window.irParaInicio = function () {
              window.scrollTo(0, 0);
              var primeiro = document.querySelector('#apps .item');
              if (primeiro) {
                  primeiro.focus();
              }
          };

          /* ---------- Navegacao pelo controle remoto ---------- */

          function listaDe(linha) {
              return Array.prototype.slice.call(linha.querySelectorAll('.item'));
          }

          function centroX(elemento) {
              var r = elemento.getBoundingClientRect();
              return r.left + r.width / 2;
          }

          function mover(direcao) {
              var atual = document.activeElement;
              var linhas = Array.prototype.slice.call(document.querySelectorAll('.row'));

              if (!atual || !atual.classList || !atual.classList.contains('item')) {
                  var primeiro = document.querySelector('.item');
                  if (primeiro) {
                      primeiro.focus();
                  }
                  return;
              }

              var linha = atual.parentNode;
              var itens = listaDe(linha);
              var posicao = itens.indexOf(atual);

              if (direcao === 'left') {
                  if (posicao > 0) {
                      itens[posicao - 1].focus();
                  }
                  return;
              }

              if (direcao === 'right') {
                  if (posicao < itens.length - 1) {
                      itens[posicao + 1].focus();
                  }
                  return;
              }

              var indiceLinha = linhas.indexOf(linha) + (direcao === 'down' ? 1 : -1);
              if (indiceLinha < 0 || indiceLinha >= linhas.length) {
                  return;
              }

              var candidatos = listaDe(linhas[indiceLinha]);
              if (candidatos.length === 0) {
                  return;
              }

              var x = centroX(atual);
              var melhor = candidatos[0];
              var menor = Math.abs(centroX(melhor) - x);
              for (var i = 1; i < candidatos.length; i++) {
                  var distancia = Math.abs(centroX(candidatos[i]) - x);
                  if (distancia < menor) {
                      menor = distancia;
                      melhor = candidatos[i];
                  }
              }

              melhor.focus();
              if (indiceLinha === 0) {
                  window.scrollTo(0, 0);
              }
          }

          document.addEventListener('keydown', function (evento) {
              var tecla = evento.keyCode;

              if (tecla === 37) {
                  evento.preventDefault();
                  mover('left');
              } else if (tecla === 39) {
                  evento.preventDefault();
                  mover('right');
              } else if (tecla === 38) {
                  evento.preventDefault();
                  mover('up');
              } else if (tecla === 40) {
                  evento.preventDefault();
                  mover('down');
              } else if (tecla === 13 || tecla === 23) {
                  var atual = document.activeElement;
                  if (atual && atual.classList && atual.classList.contains('item')) {
                      evento.preventDefault();
                      if (!evento.repeat) {
                          atual.click();
                      }
                  }
              }
          }, false);

          document.addEventListener('DOMContentLoaded', function () {
              carregarApps(true);
          });
          </script>
          </body>
          </html>
          FIM_DO_ARQUIVO

      - name: Salvar os arquivos no repositorio
        continue-on-error: true
        run: |
          git config user.name "Meu Launcher TV"
          git config user.email "actions@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "Arquivos ja estavam atualizados."
          else
            git commit -m "Atualiza arquivos do launcher"
            git push
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Conferir pecas do Android SDK
        run: |
          set -o pipefail
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            for p in "platforms;android-34" "build-tools;34.0.0"; do
              d="$ANDROID_HOME/$(echo "$p" | tr ';' '/')"
              if [ -d "$d" ]; then
                echo "OK: $p"
              else
                echo "Instalando: $p"
                sdkmanager "$p"
              fi
            done
            echo "--- plataformas:"; ls "$ANDROID_HOME/platforms"
            echo "--- build-tools:"; ls "$ANDROID_HOME/build-tools"
          } 2>&1 | tee sdk.log

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar arquivos do projeto
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/meulauncher/tv/HomeActivity.java
          test -f app/src/main/assets/index.html

      - name: Compilar APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build.log

      - name: Resumo do erro
        if: failure()
        run: |
          if [ -f build.log ]; then
            RES=$(grep -A8 -E "What went wrong|error:|FAILURE:" build.log | head -30)
          elif [ -f sdk.log ]; then
            RES=$(tail -25 sdk.log)
          else
            RES="O erro aconteceu antes da conferencia do SDK. Abra o passo marcado em vermelho."
          fi
          {
            echo "### Erro da compilacao"
            echo '~~~'
            echo "$RES"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
          MSG=$(echo "$RES" | tr '\n' ' ' | cut -c1-900)
          echo "::error title=Erro da compilacao::$MSG"

      - name: Guardar copia do APK
        uses: actions/upload-artifact@v4
        with:
          name: MeuLauncherTV
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar APK na aba Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MeuLauncherTV.apk
          ls -l MeuLauncherTV.apk
          gh release delete ultimo --cleanup-tag --yes || true
          gh release create ultimo MeuLauncherTV.apk \
            --target "$GITHUB_SHA" \
            --title "Meu Launcher TV (ultima versao)" \
            --notes "APK compilado automaticamente. Execucao numero ${{ github.run_number }}."
