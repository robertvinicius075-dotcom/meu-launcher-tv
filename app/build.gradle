plugins {
    id 'com.android.application'
}

android {
    namespace 'com.meulauncher.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.meulauncher.tv'
        minSdk 21
        targetSdk 30
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
